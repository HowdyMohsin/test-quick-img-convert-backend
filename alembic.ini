# Alembic configuration for Quick IMG Convert.
# DATABASE_URL is read from the environment (see app/alembic/env.py);
# sqlalchemy.url here is only a fallback for local SQLite dev.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
sourceless = false
splice = false
version_locations = %(here)s/alembic/versions
version_path_separator = os

sqlalchemy.url = sqlite+aiosqlite:///./dev.db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
