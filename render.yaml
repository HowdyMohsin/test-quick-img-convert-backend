# Quick IMG Convert — backend (API) on Render.
#
# Blueprint: creates the API web service + a free PostgreSQL database.
# Deploy: Render dashboard -> New -> Blueprint -> connect this repo.
# Render prompts for the `sync: false` values when the blueprint is created.
#
# Runtime: native Python (NOT Docker). The API lazy-imports the heavy
# conversion engines (pyvips, rawpy, psd-tools, pypdfium2) inside functions
# in app/engines.py, so the API boots without libvips/ffmpeg installed;
# engines that need missing system libraries simply report unhealthy and
# their pairs degrade. The conversion worker is a separate process and
# cannot run on Render's free tier (no free background workers), so this
# blueprint deploys the API only — see README.md.
#
# Lightweight tuning for the 512 MB free instance (the same code runs
# unchanged on Docker/PC/Oracle): single uvicorn worker, 40 concurrent
# connections, 5 s keep-alive; small SQLAlchemy pools (async 5 + 2, sync
# store 3 + 2, pre-ping + 5 min recycle) so one API holds at most 12 DB
# connections; pip --no-cache-dir so the build keeps no wheel cache; the
# first-boot pair health check is skipped here (QIC_STARTUP_HEALTH_CHECK=0)
# because it converts bundled samples in a background thread at boot —
# the admin formats page shows no health data until a check is run.
#
# IMPORTANT — DATABASE_URL: Render's database connection string uses the
# `postgres://` scheme, but this API uses SQLAlchemy's async engine, which
# requires `postgresql+asyncpg://`. There is no way to wire it automatically
# in a blueprint, so DATABASE_URL is `sync: false`: paste the database's
# "External Database URL" from the Render dashboard and change ONLY the
# scheme at the start, `postgres://` -> `postgresql+asyncpg://`.
# (Alembic runs the same URL at startup via entrypoint.sh.)

services:
  - type: web
    name: quick-img-convert-api
    env: python
    plan: free
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: ./entrypoint.sh uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --limit-concurrency 40 --timeout-keep-alive 5
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: APP_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SITE_URL
        value: https://quick-img-convert-api.onrender.com
      - key: DATA_DIR
        value: ./data
      - key: ENV
        value: production
      - key: API_DOCS
        value: "false"
      - key: QIC_STARTUP_HEALTH_CHECK
        value: "0"
      - key: QUOTA_TZ
        value: Asia/Karachi
      - key: RETENTION_HOURS
        value: "24"
      - key: PKR_PER_USD
        value: "280"
      - key: APPROVAL_WINDOW_HOURS
        value: "24"

databases:
  - name: quick-img-convert-db
    plan: free
    databaseName: qic
    user: qic
